<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
{{metaDescription}}
{{robots}}
{{canonical}}
<meta name="apple-itunes-app" content="app-id=1110343407">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="{{@css/page.css}}">
<script src="{{@js/theme-init.js}}"></script>
<script type="module" src="{{@js/page.js}}"></script>
{{modulepreload}}
</head>
<body>
<a class="skip" href="#main">{{ui.skip}}</a>
<header class="page-top wrap">
  <a class="brand" href="{{home}}"><img src="{{@assets/icon-192.webp}}" alt="" width="32" height="32">Tilefold</a>
  <nav class="topnav" aria-label="{{ui.langNav}}">
  {{menus}}
  </nav>
</header>
<main class="doc wrap" id="main">
{{content}}
</main>
<footer class="page-foot wrap">
  <nav class="site" aria-label="{{footer.navLabel}}">
    <a href="{{home}}"{{current.home}}>Tilefold</a>
    <a href="{{links.support}}"{{current.support}}>{{footer.support}}</a>
    <a href="{{links.privacy}}"{{current.privacy}}>{{footer.privacy}}</a>
    <a href="{{links.press}}"{{current.press}}>{{footer.press}}</a>
  </nav>
  {{badge}}
</footer>
</body>
</html>
